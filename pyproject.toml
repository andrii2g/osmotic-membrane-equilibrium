[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmotic-membrane-equilibrium"
version = "0.1.0"
description = "Idealized two-compartment osmosis with hydrostatic equilibrium and bisection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
osmotic-equilibrium = "osmotic_membrane_equilibrium.cli:main"

[project.urls]
Repository = "https://github.com/andrii2g/osmotic-membrane-equilibrium"

[tool.setuptools.packages.find]
where = ["src"]
